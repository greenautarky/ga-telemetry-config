# Fluent-Bit Tier-0 (always-on, no consent gate).
#
# Ships baseline operational + security data that we process under
# DSGVO Art. 6 (b) Vertragserfüllung + (f) berechtigtes Interesse —
# NO consent required, see ga-ihost-docs/PRIVACY_TIERS.md.
#
# Scope is intentionally narrow:
#   - kernel panic / OOM / page-allocation-failure events
#   - RAUC update events (CRA-required: track update success/failure)
#   - failed-auth events on the device admin
#   - Supervisor service-failure events
#
# Storage buffer separate from tier1 so tier-0 backpressure can't
# starve tier-1 streams.

[SERVICE]
    Flush               5
    Daemon              Off
    Log_Level           info
    Parsers_File        parsers.conf
    HTTP_Server         Off
    Storage.path        /mnt/data/fluent-bit/storage/tier0
    Storage.sync        normal
    Storage.checksum    off
    Storage.backlog.mem_limit 5M

# --- Sources: kernel + RAUC + auth + supervisor (all from journald) ---
#
# HOW THE FILTERS COMBINE — read before touching a Systemd_Filter.
#
# fluent-bit's default Systemd_Filter_Type is `Or`, and it applies to
# ALL filters of an input, not to field groups. So within one input you
# cannot express "field X AND priority <= 3": adding the PRIORITY
# filters ORs them onto the field filter and the input then matches
# every journal entry at that priority, from any unit. `And` is not the
# fix either — it conjoins all of them, demanding PRIORITY be 0 and 1
# and 2 and 3 at once, which matches nothing.
#
# Therefore: one field per input, and narrow it with a grep FILTER
# afterwards. Inputs whose filters are all meant as alternatives (auth
# below: sshd OR sudo) are correct as-is and rely on the default.

[INPUT]
    Name                systemd
    Tag                 tier0.rauc
    DB                  /mnt/data/fluent-bit/db/tier0-rauc.db
    Systemd_Filter      _SYSTEMD_UNIT=rauc.service

[INPUT]
    Name                systemd
    Tag                 tier0.kernel
    DB                  /mnt/data/fluent-bit/db/tier0-kernel.db
    Systemd_Filter      _TRANSPORT=kernel

[INPUT]
    Name                systemd
    Tag                 tier0.auth
    DB                  /mnt/data/fluent-bit/db/tier0-auth.db
    # Alternatives, not a conjunction — the default `Or` is what we want
    # here.
    #
    # dropbear is the one that actually fires on this platform: the
    # image ships dropbear, not openssh, and has no sudo. The two
    # filters below them matched nothing at all, so this input — the
    # failed-authentication evidence required under CRA and Art. 32 —
    # was silent. They are kept for images that do ship them.
    Systemd_Filter      _SYSTEMD_UNIT=dropbear.service
    Systemd_Filter      _SYSTEMD_UNIT=sshd.service
    Systemd_Filter      _COMM=sudo

[INPUT]
    Name                systemd
    Tag                 tier0.supervisor
    DB                  /mnt/data/fluent-bit/db/tier0-supervisor.db
    # The Supervisor runs as a container; there is no
    # `hassio-supervisor.service` unit in the journal, so the previous
    # _SYSTEMD_UNIT filter matched nothing and this input collected
    # only through the accidental disjunction described above.
    Systemd_Filter      CONTAINER_NAME=hassio_supervisor

# --- Narrowing: what each source is allowed to contribute ---

# Kernel: emerg/alert/crit/err only. Sound here because kernel messages
# carry a real severity in PRIORITY.
[FILTER]
    Name                grep
    Match               tier0.kernel
    Regex               PRIORITY [0-3]

# Supervisor: PRIORITY is useless for container output — Docker's
# journald driver stamps everything written to stderr as 3 — so filter
# on the application's own severity in the message text instead.
[FILTER]
    Name                grep
    Match               tier0.supervisor
    Regex               MESSAGE (ERROR|CRITICAL|FATAL)

# --- Filters: stamp tier + identity ---

[FILTER]
    Name                modify
    Match               tier0.*
    Add                 tier 0
    Add                 device_label ${DEVICE_LABEL}
    Add                 device_uuid ${DEVICE_UUID}
    Add                 ga_env ${GA_ENV}

# --- Output: Loki on ga-tools ---
#
# Endpoint AND credentials come from the systemd environment
# (/mnt/data/fluent-bit/env, written by /usr/libexec/ga-fluent-bit-env from the
# per-device ga-fleet-loki.yaml sidecar; ADR-0003 Step 3). Anonymous-safe
# defaults are baked into the unit, so an absent cred degrades to the old
# unauthenticated :3100 behaviour instead of taking the stream down.
#
# tier-0 is the ONLY fluent-bit running on a device without telemetry consent
# (tier-1 is consent-gated), so on most of the fleet this is the sole Loki
# writer. It therefore MUST authenticate before Loki gets `auth_enabled: true`
# — otherwise those devices go completely dark. Port used to be hard-coded to
# 3100 and the tenant to a shared literal; both are now per-device.
#
# tenant_id is informational only: Caddy@loki overwrites X-Scope-OrgID
# server-side from the authenticated username, so a device cannot write into
# another device's tenant.

[OUTPUT]
    Name                loki
    Match               tier0.*
    Host                ${LOKI_HOST}
    Port                ${LOKI_PORT}
    URI                 /loki/api/v1/push
    http_user           ${LOKI_USER}
    http_passwd         ${LOKI_PASSWORD}
    tenant_id           ${LOKI_TENANT}
    # device_uuid is a label, not just a record field: DEVICE_LABEL is
    # empty on devices where /mnt/data/ga-device-label was never
    # written, and a stream labelled only `unknown` cannot be traced
    # back to a device afterwards.
    Labels              tier=0, device_label=${DEVICE_LABEL}, device_uuid=${DEVICE_UUID}, ga_env=${GA_ENV}
    # Higher than tier1 so important events get through under backpressure
    Workers             1
    # Retry on network blips — Tier 0 is the most important stream
    Retry_Limit         False
